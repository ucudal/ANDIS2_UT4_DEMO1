# Facilidad de despliegue: a qué versión de Users va cada solicitud de la
# entrada de despliegue, en el puerto 8091. Las demos 27 a 30 reescriben este
# archivo en el contenedor y recargan nginx, sin cortar el servicio; el archivo
# del repositorio queda como estaba.
#
# Al principio, todo va a la versión 1. Las otras estrategias:
#
# Blue/Green: todo a una versión, y se conmuta cambiando el destino.
#
#   map $host $users_target { default users-service-v2:8000; }
#
# Rolling Upgrade: a todas las instancias del grupo, de las dos versiones.
#
#   map $host $users_target { default users-pool:8000; }
#
# Canary: una fracción de las solicitudes a la versión nueva.
#
#   split_clients "${request_id}" $users_target {
#       10% users-service-v2:8000;
#       *   users-service:8000;
#   }
#
# A/B Testing no está acá: la variante la decide la versión 2 -ver
# UsersService/Experiment.cs-.
map $host $users_target {
    default users-service:8000;
}
