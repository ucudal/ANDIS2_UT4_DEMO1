# El análisis que decide si una versión nueva de Users sigue adelante: qué
# fracción de sus solicitudes respondió con error, según Prometheus. Lo usan los
# Rollout de las demos 32 y 33, en sus pasos.
#
# Argo Rollouts le pasa el hash de la plantilla de los pods de la versión nueva,
# pod-hash, y la consulta mira solo esos pods. Mide 3 veces, cada 10 segundos:
# - Menos del 5% de errores en las tres: el análisis pasa y el despliegue sigue.
# - Una sola medida con 5% o más: el análisis falla, y Argo Rollouts aborta el
#   despliegue y vuelve a la versión anterior, sin que nadie intervenga.
#
# Solo cuentan las solicitudes POST, las de SOAP: /health y /metrics también
# pasan por la métrica, siempre responden bien y diluirían los errores.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate
  namespace: andis
spec:
  args:
    - name: pod-hash
  metrics:
    - name: error-rate
      # Antes de la primera medida, los pods nuevos tienen que haber recibido
      # solicitudes, y Prometheus tiene que haber leído varias veces sus
      # métricas. Con el 10% del tráfico, de la demo 33, llegan pocas. Sin
      # datos, la consulta da 0/0, que no cumple ninguna de las dos
      # condiciones: el resultado no es concluyente, y Argo Rollouts detiene el
      # despliegue para que decida una persona.
      initialDelay: 30s
      interval: 10s
      count: 3
      failureLimit: 0
      successCondition: result[0] < 0.05
      failureCondition: result[0] >= 0.05
      provider:
        prometheus:
          address: http://prometheus.andis.svc:9090
          query: |
            (sum(rate(http_server_request_duration_seconds_count{rollouts_pod_template_hash="{{args.pod-hash}}", http_request_method="POST", http_response_status_code=~"5.."}[30s])) or vector(0))
            /
            sum(rate(http_server_request_duration_seconds_count{rollouts_pod_template_hash="{{args.pod-hash}}", http_request_method="POST"}[30s]))
