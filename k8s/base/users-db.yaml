# La base de Users en el clúster: la misma imagen y los mismos datos iniciales
# que en Docker Compose, pero una base propia, sin compartirla con Compose.
#
# Los datos iniciales salen de src/UsersService/mongoinit: demos/k8s-up.sh crea con
# ese directorio el ConfigMap users-db-init, sin copiar el archivo.
#
# Los datos viven en un emptyDir: se pierden si se borra el pod. Para una demo
# alcanza; en producción sería un PersistentVolumeClaim, o una base gestionada.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: users-db
  namespace: andis
spec:
  serviceName: users-db
  replicas: 1
  selector:
    matchLabels:
      app: users-db
  template:
    metadata:
      labels:
        app: users-db
    spec:
      containers:
        - name: mongo
          image: mongo:9
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: Pa55w0rd
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "-u", "usersusr", "-p", "Pa55w0rd", "--authenticationDatabase", "usersdb", "usersdb", "--eval", "db.runCommand({ ping: 1 }).ok"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: users-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: users-db
  namespace: andis
spec:
  selector:
    app: users-db
  ports:
    - port: 27017
