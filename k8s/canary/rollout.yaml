# Canary con Argo Rollouts: la demo 33. Es la demo 29, pero lo que allí se
# hacía a mano -cambiar el porcentaje en el gateway, mirar las métricas, decidir
# si seguir o volver- lo hace Argo Rollouts.
#
# A diferencia de la demo 32, el reparto no depende de cuántos pods hay: con
# trafficRouting, Argo cambia los pesos de la HTTPRoute users entre dos Service,
# users-stable y users-canary, mediante el plugin de Gateway API. NGINX Gateway
# Fabric reparte las solicitudes según esos pesos.
#
# Los pasos: 10% a la versión nueva, análisis, 50%, análisis, y 100%. Cada
# análisis mide los errores de los pods nuevos -ver
# k8s/base/analysis-error-rate.yaml-. Si fallan, Argo aborta y vuelve todo a la
# versión estable, sin que nadie intervenga.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: users
  namespace: andis
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          image: users-service:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: users-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          # Al detener un pod, el Gateway tarda un momento en dejar de mandarle
          # solicitudes. El pod espera 5 segundos antes de detenerse, para que
          # no se pierda ninguna durante el reemplazo.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
  strategy:
    canary:
      stableService: users-stable
      canaryService: users-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: users
            namespace: andis
      steps:
        - setWeight: 10
        - analysis:
            templates:
              - templateName: error-rate
            args:
              - name: pod-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - analysis:
            templates:
              - templateName: error-rate
            args:
              - name: pod-hash
                valueFrom:
                  podTemplateHashValue: Latest
