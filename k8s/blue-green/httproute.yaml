# Las rutas del Gateway hacia Users. No cambian durante el despliegue: lo que
# cambia es a qué pods apunta cada Service.
#
# - users: los clientes, en http://localhost:8092/users/, van a users-active.
# - users-preview: http://preview.localhost:8092/users/ va a users-preview, para
#   probar la versión nueva antes de conmutar. curl resuelve *.localhost a la
#   máquina local. Una ruta con nombre de host gana sobre una sin nombre.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: users
  namespace: andis
spec:
  parentRefs:
    - name: andis
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /users/
      backendRefs:
        - name: users-active
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: users-preview
  namespace: andis
spec:
  parentRefs:
    - name: andis
  hostnames:
    - preview.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /users/
      backendRefs:
        - name: users-preview
          port: 8000
