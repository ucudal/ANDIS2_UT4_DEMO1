# Procesamiento diferido: la demo 37. El worker solo está encendido dentro de
# una ventana, con 3 réplicas; fuera de ella, 0. Las Orders que llegan fuera de
# la ventana esperan en la cola orders.process hasta que se abre.
#
# La ventana simula las horas en que la energía de la red es más limpia, o más
# barata. Se abre y se cierra con la clave Energy/WindowOpen del almacén de
# configuración, Consul, y orders-service la publica en GET /energy/window -ver
# src/OrdersService/Controllers/EnergyController.cs-. En producción, la ventana
# sale de un pronóstico de intensidad de carbono: en AKS, el carbon-aware KEDA
# operator; en AWS, una regla programada de EventBridge.
#
# KEDA consulta el endpoint cada 5 segundos y pide tantas réplicas como indica
# replicas: con targetValue en 1, 3 réplicas para un valor de 3. De paso, KEDA
# depende de orders-service para saber si la ventana está abierta.
#
# No hay trigger de la cola: si lo hubiera, KEDA encendería el worker apenas
# llegara un mensaje, y la ventana no serviría.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: orders-worker
  namespace: andis
spec:
  scaleTargetRef:
    name: orders-worker
  minReplicaCount: 0
  maxReplicaCount: 3
  pollingInterval: 5
  cooldownPeriod: 10
  triggers:
    - type: metrics-api
      metadata:
        url: http://orders-service:8000/energy/window
        valueLocation: replicas
        targetValue: "1"
