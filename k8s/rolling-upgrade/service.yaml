# Un solo Service para todos los pods de Users, de cualquier versión: durante
# el reemplazo reparte entre los viejos y los nuevos, como el alias users-pool
# de la demo 29. Lo usan el Deployment y el Rollout de la demo 33, uno por vez.
apiVersion: v1
kind: Service
metadata:
  name: users
  namespace: andis
spec:
  selector:
    app: users
  ports:
    - port: 8000
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: users
  namespace: andis
spec:
  parentRefs:
    - name: andis
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /users/
      backendRefs:
        - name: users
          port: 8000
