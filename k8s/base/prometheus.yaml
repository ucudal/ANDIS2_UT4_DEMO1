# Prometheus del clúster: lee las métricas de cada pod de Users, para que Argo
# Rollouts decida con ellas si una versión nueva sigue o vuelve atrás -ver
# analysis-error-rate.yaml-. Es el mismo Prometheus que en Docker Compose, pero
# en lugar de una lista fija de servicios, le pregunta a Kubernetes qué pods hay:
# los pods aparecen y desaparecen durante un despliegue.
#
# A cada serie le agrega las etiquetas del pod. Entre ellas, la versión de la
# plantilla del pod: rollouts_pod_template_hash con Argo Rollouts, y
# pod_template_hash con un Deployment. Así se separan las métricas de cada
# versión.
#
# Para las demos de eficiencia energética, de la 35 a la 37, lee además el
# cAdvisor del kubelet: cuánta CPU usa y cuánta reserva cada contenedor. Con eso
# estima la energía de cada pod -ver las reglas de energy.rules.yml-.
#
# Consola: http://localhost:30090, publicado por kind -ver k8s/kind.yaml-.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: andis
---
# Permiso para listar los pods del namespace andis, y nada más.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: andis
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: andis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: andis
---
# Permiso para encontrar el nodo y leer las métricas de su kubelet, donde está
# el cAdvisor. Los nodos no son de ningún namespace: hace falta un ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: andis-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: andis-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: andis-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: andis
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: andis
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    rule_files:
      - /etc/prometheus/energy.rules.yml
    scrape_configs:
      - job_name: users
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [andis]
        relabel_configs:
          # Solo los pods de Users, en el puerto 8000.
          - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_number]
            regex: users;8000
            action: keep
          # Las etiquetas del pod, como etiquetas de cada serie.
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # La versión, del tag de la imagen: v1, v2 o v3-bad. La usa el panel
          # de Grafana "Errores de cada versión, según Users".
          - source_labels: [__meta_kubernetes_pod_container_image]
            regex: .*:(.+)
            target_label: version
      # El cAdvisor del kubelet, en el puerto 10250 del nodo. El kubelet pide
      # el token de la cuenta de servicio, y su certificado no está firmado
      # para la IP del nodo: no se verifica.
      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        metric_relabel_configs:
          # Solo la CPU usada y la reservada, de los contenedores del namespace
          # andis. container="" es el pod entero o su contenedor pause.
          - source_labels: [__name__]
            regex: container_cpu_usage_seconds_total|container_spec_cpu_shares
            action: keep
          - source_labels: [namespace, container]
            regex: andis;.+
            action: keep
  # Power Monitor: la energía de cada pod se estima, no se mide. El nodo de kind
  # no tiene contadores de energía -RAPL ni hwmon-, como pasa en casi cualquier
  # máquina virtual. Se usa el modelo de Cloud Carbon Footprint:
  #
  #   watts = vCPU reservadas × Wmin + vCPU usadas × (Wmax − Wmin)
  #
  # Wmin y Wmax son los watts de una vCPU ociosa y al 100%: 0,78 y 3,76 en
  # Azure, que son los que se usan acá; 0,74 y 3,5 en AWS. Ver
  # https://www.cloudcarbonfootprint.org/docs/methodology/
  #
  # La parte reservada hace que un pod ocioso consuma: la máquina tiene que
  # estar encendida para la CPU que el pod pidió, aunque no la use. Las vCPU
  # reservadas salen de los shares del cgroup: 1024 por vCPU.
  energy.rules.yml: |
    groups:
      - name: energy
        interval: 5s
        rules:
          - record: pod:cpu_used:vcpu
            expr: sum by (pod) (rate(container_cpu_usage_seconds_total{job="cadvisor"}[30s]))
          - record: pod:cpu_reserved:vcpu
            expr: sum by (pod) (container_spec_cpu_shares{job="cadvisor"}) / 1024
          - record: pod:power:watts
            expr: pod:cpu_reserved:vcpu * 0.78 + on (pod) pod:cpu_used:vcpu * (3.76 - 0.78)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: andis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=2h
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: andis
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      nodePort: 30090
