# El clúster de las demos con Kubernetes: las de despliegue, de la 32 a la 34, y
# las de eficiencia energética, de la 35 a la 37. Un solo nodo, que es un
# contenedor de Docker. Lo crea demos/k8s-up.sh.
#
# kind publica en la máquina dos puertos del nodo:
# - 8092: el Gateway, la entrada de los clientes. Es el equivalente a la entrada
#   de despliegue de Docker Compose, en el puerto 8091.
# - 30090: Prometheus del clúster, que lee las métricas de cada versión.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: andis
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30092
        hostPort: 8092
      - containerPort: 30090
        hostPort: 30090
