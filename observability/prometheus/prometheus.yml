# Prometheus consulta el endpoint /metrics de cada servicio cada 5 segundos.
# Las métricas de k6 no se consultan: k6 las envía con remote write.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: users-service
    static_configs:
      - targets: ["users-service:8000"]

  # La versión 2 de Users, de las demos de facilidad de despliegue. Como en
  # orders-worker, el DNS devuelve una IP por réplica.
  - job_name: users-service-v2
    dns_sd_configs:
      - names: ["users-service-v2"]
        type: A
        port: 8000
        refresh_interval: 5s

  - job_name: products-service
    static_configs:
      - targets: ["products-service:8000"]

  - job_name: orders-service
    static_configs:
      - targets: ["orders-service:8000"]

  # El DNS de Docker devuelve una IP por cada réplica de orders-worker: así
  # Prometheus consulta a todas, y deja de consultar a las que se detienen.
  - job_name: orders-worker
    dns_sd_configs:
      - names: ["orders-worker"]
        type: A
        port: 8000
        refresh_interval: 5s

  - job_name: orders-projector
    static_configs:
      - targets: ["orders-projector:8000"]

  # Plugin rabbitmq_prometheus: largo de la cola y cantidad de consumidores.
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics", "queue_consumer_count"]
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Sidecar de Products: Envoy publica sus estadísticas, entre ellas los tokens
  # rechazados y las solicitudes que permite o rechaza la autorización. Comparte
  # el espacio de red de products-service, así que se lo encuentra con ese
  # nombre.
  - job_name: products-sidecar
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["products-service:9901"]

  # Keycloak: inicios de sesión y validaciones de tokens, en el puerto de
  # administración.
  - job_name: keycloak
    static_configs:
      - targets: ["keycloak:9000"]
