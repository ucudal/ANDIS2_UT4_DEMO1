# La base de Users en el clúster: la misma imagen y los mismos datos iniciales
# que en Docker Compose, pero una base propia, sin compartirla con Compose.
#
# Los datos iniciales salen de src/UsersService/pginit: demos/k8s-up.sh crea con
# ese directorio el ConfigMap users-db-init, sin copiar el archivo.
#
# Los datos viven en un emptyDir: se pierden si se borra el pod. Para una demo
# alcanza; en producción sería un PersistentVolumeClaim, o una base gestionada.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: users-db
  namespace: andis
spec:
  serviceName: users-db
  replicas: 1
  selector:
    matchLabels:
      app: users-db
  template:
    metadata:
      labels:
        app: users-db
    spec:
      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: usersdb
            - name: POSTGRES_USER
              value: usersusr
            - name: POSTGRES_PASSWORD
              value: Pa55w0rd
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "usersusr", "-d", "usersdb"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: users-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: users-db
  namespace: andis
spec:
  selector:
    app: users-db
  ports:
    - port: 5432
