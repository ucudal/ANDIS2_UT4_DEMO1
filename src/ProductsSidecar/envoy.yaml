# Sidecar de Products: un proxy Envoy que corre junto a products-service, en su
# mismo espacio de red -network_mode: service:products-service en
# docker-compose.yaml-. Para Envoy, products-service es 127.0.0.1:8000, y para
# los demás contenedores el sidecar es products-service:9000.
#
# Le agrega a Products autenticación, autorización y un registro de accesos sin
# cambiar una línea de su código, y en otra tecnología: Envoy está escrito en
# C++ y se configura con este archivo.
#
# - Autenticación -filtro jwt_authn-: si la solicitud trae un token, verifica
#   su firma con las claves públicas de Keycloak, el emisor y el vencimiento.
#   Un token inválido recibe 401. Sin token, la solicitud sigue, como anónima.
# - Autorización -filtro rbac-: cualquiera puede leer -GET-; para escribir
#   -POST, PUT, DELETE- hace falta un token con el rol admin. Si no, 403.
# - Registro de accesos: una línea [SIDECAR] por solicitud, con el usuario del
#   token y el motivo del rechazo, si lo hubo.
#
# Protege a Products de cualquier llamador, no solo de lo que entra por el
# gateway: también de los demás contenedores de la red.

admin:
  # Estadísticas de Envoy para Prometheus en /stats/prometheus.
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: products
      address:
        socket_address: { address: 0.0.0.0, port_value: 9000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: products
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[SIDECAR] %RESPONSE_CODE% %REQ(:METHOD)% %REQ(:PATH)% usuario=%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:jwt_payload:preferred_username)% %RESPONSE_CODE_DETAILS%\n"
                route_config:
                  virtual_hosts:
                    - name: products
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: products_service }
                http_filters:
                  # Autenticación: verifica el token, si lo hay, y deja sus
                  # claims en jwt_payload para la autorización.
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keycloak:
                          # El emisor que figura en los tokens: la URL de
                          # Keycloak que ven los clientes, no la de la red de
                          # Docker -ver KC_HOSTNAME en docker-compose.yaml-.
                          issuer: http://localhost:8080/realms/andis
                          # Las claves públicas se piden una vez y se guardan 5
                          # minutos: verificar un token no llama a Keycloak.
                          remote_jwks:
                            http_uri:
                              uri: http://keycloak:8080/realms/andis/protocol/openid-connect/certs
                              cluster: keycloak
                              timeout: 5s
                            cache_duration: 300s
                          forward: true
                          payload_in_metadata: jwt_payload
                      rules:
                        - match: { prefix: "/" }
                          requires:
                            requires_any:
                              requirements:
                                - provider_name: keycloak
                                # Sin token, la solicitud sigue como anónima; con
                                # un token inválido, 401.
                                - allow_missing: {}
                  # Autorización: se acepta la solicitud si cumple alguna de las
                  # dos políticas; si no, 403.
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          # Cualquiera puede leer, con o sin token.
                          lecturas:
                            permissions:
                              - header: { name: ":method", string_match: { exact: GET } }
                            principals:
                              - any: true
                          # Para todo lo demás, un token con el rol admin en
                          # realm_access.roles.
                          administracion:
                            permissions:
                              - any: true
                            principals:
                              - metadata:
                                  filter: envoy.filters.http.jwt_authn
                                  path:
                                    - key: jwt_payload
                                    - key: realm_access
                                    - key: roles
                                  value:
                                    list_match:
                                      one_of:
                                        string_match: { exact: admin }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # products-service, en el mismo espacio de red que el sidecar.
    - name: products_service
      type: STATIC
      load_assignment:
        cluster_name: products_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8000 }

    # Keycloak, para obtener sus claves públicas.
    - name: keycloak
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: keycloak
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: keycloak, port_value: 8080 }
