# Módulo de JavaScript de nginx -njs-, incluido en la imagen oficial. Lo usa el
# servidor HTTPS para leer los claims del token -ver identity.js-.
load_module modules/ngx_http_js_module.so;

events {}

# El gateway tiene dos entradas:
#
# - HTTP, en el puerto 80: la de las demos de disponibilidad y rendimiento, sin
#   los patrones de seguridad. Cualquiera llega a cualquier ruta, incluidas las
#   de administración -/chaos, /patterns, /cache-, sin identificarse.
# - HTTPS, en el puerto 443: las mismas rutas, con los patrones de seguridad.
#
# Y dos entradas para demos puntuales: una fachada, en el puerto 8090, para la
# demo de Strangler Fig, y la entrada de despliegue, en el 8091, para las demos
# de facilidad de despliegue.
#
# Así cada demo de seguridad compara la misma solicitud con y sin el patrón. En
# producción quedaría solo la entrada HTTPS, y el puerto 80 redirigiría a ella.

http {
    # Throttling por cliente: cada IP puede crear como máximo 1 orden por
    # segundo, con una ráfaga de hasta 5. Lo que excede el límite recibe 429 Too
    # Many Requests. Solo se limitan los POST: para el resto de los métodos la
    # clave queda vacía y nginx no aplica el límite.
    #
    # nginx llama a limit_req "rate limiting", pero en el catálogo de patrones
    # de Azure, que sigue este repositorio, Rate Limiting es un patrón del
    # cliente: el cliente regula su ritmo para no superar el límite de un
    # servicio. Lo que hace limit_req es Throttling: lo aplica el servicio, en
    # este caso por cliente. Ver PATTERNS.md.
    map $request_method $orders_write_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $orders_write_limit_key zone=orders_write:10m rate=1r/s;
    limit_req_status 429;

    # Se usa el DNS interno de Docker y se vuelven a resolver los nombres cada
    # 5 segundos. Sin esto, nginx resuelve las IP una sola vez al arrancar y, si
    # un servicio se reinicia con otra IP, sigue enviándole tráfico a la vieja.
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        # Con proxy_pass a una variable, nginx resuelve el nombre en cada
        # solicitud y reenvía la URI original sin modificarla.
        set $users_service    users-service:8000;
        set $products_service products-service:8000;
        set $orders_service   orders-service:8000;

        # HTTP/1.1 hacia los servicios: con HTTP/1.0 -el valor por defecto-,
        # Kestrel rechaza los POST sin cuerpo.
        proxy_http_version 1.1;

        location /users/ {
            proxy_pass http://$users_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /products/ {
            proxy_pass http://$products_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Valet Key: sin el patrón, la imagen de un Product pasa por el gateway
        # y por Products. Para eso el gateway tiene que aceptar cuerpos de hasta
        # 20 MB en esta ruta; en las demás rige el límite por defecto de nginx,
        # 1 MB.
        location ~ "^/products/[0-9a-f]{24}/image$" {
            client_max_body_size 20m;
            proxy_pass http://$products_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /orders/ {
            limit_req zone=orders_write burst=5 nodelay;

            proxy_pass http://$orders_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health Endpoint Monitoring: el health de cada servicio, a través del gateway.
        location = /health/users {
            rewrite ^ /health break;
            proxy_pass http://$users_service;
        }

        location = /health/products {
            rewrite ^ /health break;
            proxy_pass http://$products_service;
        }

        location = /health/orders {
            rewrite ^ /health break;
            proxy_pass http://$orders_service;
        }

        # Anti-corruption Layer: Purchases, con su propio modelo.
        location /purchases/ {
            set $purchases_service purchases-service:8000;
            proxy_pass http://$purchases_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Backends for Frontends: un backend para cada cliente.
        location /web/ {
            set $bff_web bff-web:8000;
            proxy_pass http://$bff_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /mobile/ {
            set $bff_mobile bff-mobile:8000;
            proxy_pass http://$bff_mobile;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # -----------------------------------------------------------------------
    # Strangler Fig: la fachada
    # -----------------------------------------------------------------------

    # Una línea por solicitud, con quién la atendió: el monolito o un servicio.
    log_format strangler '[STRANGLER] $status $request_method $request_uri -> $backend';

    # Los clientes apuntan siempre a la fachada, y cada ruta va al monolito o al
    # microservicio que la reemplaza. La tabla de rutas está en
    # strangler-routes.conf: migrar una ruta es cambiar una línea y recargar
    # nginx, sin cortar el servicio y sin que el cliente se entere.
    server {
        listen 8090;

        access_log /dev/stdout strangler;

        include /etc/nginx/strangler-routes.conf;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Indica quién atendió la solicitud.
        add_header X-Served-By $backend always;

        location /users/ {
            set $backend $users_route;
            proxy_pass http://$backend;
        }

        location /products/ {
            set $backend $products_route;
            proxy_pass http://$backend;
        }

        location /orders/ {
            set $backend $orders_route;
            proxy_pass http://$backend;
        }
    }

    # -----------------------------------------------------------------------
    # Facilidad de despliegue: la entrada de las demos 27 a 30
    # -----------------------------------------------------------------------

    # Una línea por solicitud, con la instancia que la atendió y su versión.
    log_format deployment '[DEPLOY] $status $request_method $request_uri -> $upstream_addr version=$upstream_http_x_version';

    # Qué versión de Users atiende cada solicitud: define $users_target.
    # Cambiar de estrategia es reescribir ese archivo y recargar nginx.
    include /etc/nginx/deployment-routes.conf;

    # Los clientes de estas demos apuntan siempre al 8091, y no se enteran de
    # qué versión los atiende. Cada respuesta lo dice en X-Version, que agrega
    # Users -ver UsersService/Release.cs-, y en X-Served-By, que agrega nginx.
    server {
        listen 8091;

        access_log /dev/stdout deployment;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Rolling Upgrade: si una instancia del grupo ya no está, la conexión
        # falla enseguida y nginx prueba con la siguiente. Como la solicitud no
        # llegó a enviarse, se reintenta aunque sea un POST, como los de SOAP.
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout;

        add_header X-Served-By $users_target always;

        location /users/ {
            proxy_pass http://$users_target;
        }
    }

    # -----------------------------------------------------------------------
    # Entrada HTTPS, con los patrones de seguridad
    # -----------------------------------------------------------------------

    # Federated Identity: los claims del token, leídos con identity.js. Se
    # calculan solo si se usan, después de validar el token.
    js_import identity from identity.js;
    js_set $user_id    identity.userId;
    js_set $user_name  identity.userName;
    js_set $user_roles identity.userRoles;

    # Gatekeeper: las solicitudes que mandan un cuerpo -POST y PUT- tienen que
    # ser JSON. Vale 1 si no lo son.
    map "$request_method:$content_type" $body_not_json {
        "~^(POST|PUT):application/json" 0;
        "~^(POST|PUT):"                 1;
        default                         0;
    }

    # Una línea por solicitud, con el usuario del token y la dirección del
    # servicio que la atendió. Si el gateway la rechazó, el servicio queda vacío: la solicitud
    # no llegó a ningún servicio.
    # Con 401, el token no es válido y el usuario que dice no cuenta.
    map $status $log_user_name {
        401     "-";
        default $user_name;
    }
    log_format https '[HTTPS] $status $request_method $request_uri usuario=$log_user_name servicio=$upstream_addr';

    server {
        listen 443 ssl;

        access_log /dev/stdout https;

        # Las respuestas que arma el propio gateway son JSON, como las de los
        # servicios.
        default_type application/json;

        set $users_service    users-service:8000;
        set $orders_service   orders-service:8000;
        set $keycloak         keycloak:8080;
        # Sidecar: /products/ va al sidecar de Products, que corre junto a
        # products-service y escucha en el puerto 9000 -ver
        # ProductsSidecar/envoy.yaml-, y no directamente al servicio.
        set $products_service products-service:9000;

        proxy_http_version 1.1;

        # Gateway Offloading: el gateway termina TLS. Los servicios siguen
        # hablando HTTP dentro de la red de Docker, sin certificados ni
        # configuración de TLS.
        ssl_certificate     /etc/nginx/tls/gateway.crt;
        ssl_certificate_key /etc/nginx/tls/gateway.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Gateway Offloading: el gateway comprime las respuestas, si el cliente
        # lo acepta. Los servicios responden sin comprimir.
        gzip            on;
        gzip_proxied    any;
        gzip_types      application/json text/xml application/xml;
        gzip_min_length 1024;

        # Gateway Offloading y Federated Identity: toda solicitud necesita un
        # token válido de Keycloak. Antes de reenviarla, el gateway hace una
        # subsolicitud a /_auth, que le pregunta a Keycloak si el token es
        # válido. Si Keycloak responde 200, la solicitud sigue; si responde 401,
        # el gateway responde 401 y la solicitud no llega al servicio. Los
        # servicios no validan tokens.
        auth_request /_auth;

        location = /_auth {
            internal;
            proxy_pass http://$keycloak/realms/andis/protocol/openid-connect/userinfo;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        # Gatekeeper: lo que llega a los servicios lo decide el gateway.
        #
        # - Sanea los encabezados de identidad: los arma con los claims del
        #   token y reemplaza los que haya mandado el cliente. Un cliente no se
        #   puede hacer pasar por otro mandando X-User-Id.
        # - Limita el tamaño del cuerpo a 64 KB, que alcanza para cualquier
        #   solicitud de la aplicación: 413 si es más grande. Las imágenes de
        #   los Products no pasan por el gateway: van directamente al
        #   almacenamiento -ver Valet Key-.
        # - Publica solo las rutas de la aplicación, con los métodos que usa
        #   cada una. Las de administración -/chaos, /patterns, /cache,
        #   /metrics, /orders/projections/rebuild- y cualquier otra responden
        #   404 sin llegar a los servicios.
        # - Exige JSON en los POST y PUT: 415 si el cuerpo es de otro tipo.
        # - Valida el formato de los ids en la ruta: el de un Product tiene 24
        #   caracteres hexadecimales, y el de una Order o un User es un número.
        proxy_set_header Host        $host;
        proxy_set_header X-Real-IP   $remote_addr;
        proxy_set_header X-User-Id    $user_id;
        proxy_set_header X-User-Name  $user_name;
        proxy_set_header X-User-Roles $user_roles;

        client_max_body_size 64k;

        location = /users/UserService.svc {
            limit_except GET POST { deny all; }
            proxy_pass http://$users_service;
        }

        location ~ "^/products/([0-9a-f]{24})?$" {
            limit_except GET POST PUT { deny all; }
            if ($body_not_json) {
                return 415 '{"detail": "Gatekeeper: el cuerpo tiene que ser JSON"}\n';
            }
            proxy_pass http://$products_service;
        }

        # Valet Key: la imagen de un Product. GET redirige al almacenamiento.
        # PUT la sube a través de Products, sin Valet Key, con el límite de
        # 64 KB: una imagen real no pasa.
        location ~ "^/products/[0-9a-f]{24}/image$" {
            limit_except GET PUT { deny all; }
            proxy_pass http://$products_service;
        }

        location ~ "^/products/[0-9a-f]{24}/image/upload-url$" {
            limit_except POST { deny all; }
            proxy_pass http://$products_service;
        }

        location ~ ^/orders/(\d+(/status|/events)?|user/\d+/details(/view)?)?$ {
            limit_except GET POST { deny all; }
            limit_req zone=orders_write burst=5 nodelay;
            if ($body_not_json) {
                return 415 '{"detail": "Gatekeeper: el cuerpo tiene que ser JSON"}\n';
            }
            proxy_pass http://$orders_service;
        }

        # Health Endpoint Monitoring: sin token, para que se pueda monitorear.
        location ~ ^/health/(users|products|orders)$ {
            auth_request off;
            set $health_service $1-service:8000;
            rewrite ^ /health break;
            proxy_pass http://$health_service;
        }

        location / {
            return 404 '{"detail": "Gatekeeper: ruta no publicada"}\n';
        }

        # Las respuestas de error que arma el gateway, como JSON. Las de los
        # servicios llegan tal cual.
        error_page 401 = @unauthorized;
        error_page 403 = @forbidden;
        error_page 413 = @too_large;

        location @unauthorized {
            add_header WWW-Authenticate 'Bearer realm="andis"' always;
            return 401 '{"detail": "Gateway: falta el token o no es válido"}\n';
        }

        location @forbidden {
            return 403 '{"detail": "Gatekeeper: método no permitido en esta ruta"}\n';
        }

        location @too_large {
            return 413 '{"detail": "Gatekeeper: el cuerpo supera 64 KB"}\n';
        }
    }
}
