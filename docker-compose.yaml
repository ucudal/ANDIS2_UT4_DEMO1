services:
  api-gateway:
    build:
      context: ./src
      dockerfile: ./ApiGateway/Dockerfile
    image: api-gateway:latest
    ports:
      # HTTP, sin los patrones de seguridad, y HTTPS, con ellos -ver
      # ApiGateway/nginxconf/nginx.conf-.
      - "80:80"
      - "443:443"
      # Strangler Fig: la fachada, con la tabla de rutas que se migra de a una
      # -ver ApiGateway/nginxconf/nginx.conf-.
      - "8090:8090"
      # Facilidad de despliegue: la entrada de las demos 27 a 30, hacia las dos
      # versiones de Users -ver ApiGateway/nginxconf/deployment-routes.conf-.
      - "8091:8091"
    depends_on:
      # Solo la entrada HTTPS usa Keycloak, al validar cada token: alcanza con
      # que arranque.
      keycloak:
        condition: service_started
      users-service:
        condition: service_healthy
      products-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.4-management
    ports:
      - "5672:5672"
      # Consola de administración: http://localhost:15672 (guest / guest)
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Cache-Aside: caché de Products. Sin volumen: si se recrea el contenedor, la
  # caché arranca vacía y se vuelve a llenar con las lecturas.
  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  orders-db:
    image: mysql:26
    environment:
      MYSQL_ROOT_PASSWORD: "Pa55w0rd"
      MYSQL_DATABASE: "ordersdb"
      MYSQL_USER: "ordersusr"
      MYSQL_PASSWORD: "Pa55w0rd"
    ports:
      - "3306:3306"
    volumes:
      - ./src/OrdersService/mysqldata:/var/lib/mysql
      - ./src/OrdersService/mysqlinit:/docker-entrypoint-initdb.d
    healthcheck:
      # Se consulta la base con el usuario de la aplicación: durante la
      # inicialización ese usuario todavía no existe y el chequeo falla.
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-u", "ordersusr", "-pPa55w0rd", "-e", "SELECT 1 FROM ordersdb.order_events LIMIT 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  orders-service:
    build:
      context: ./src
      dockerfile: ./OrdersService/Dockerfile
    image: orders-service:latest
    environment:
      SERVICE_NAME: "orders-service"
      CONNECTIONSTRINGS__ORDERSDB: "Server=orders-db;Port=3306;Database=ordersdb;User=ordersusr;Password=Pa55w0rd"
      USERSSERVICE__BASEURL: "http://users-service:8000/users/UserService.svc"
      PRODUCTSSERVICE__BASEURL: "http://products-service:8000/products/"
      RABBITMQ__HOST: "rabbitmq"
      CONSUL__URL: "http://consul:8500"
      # Transactional Outbox: el relay publica los eventos que quedan en la base.
      OUTBOX__ENABLED: "true"
    ports:
      - "8000:8000"
    healthcheck:
      # La imagen de ASP.NET no trae curl: se hace el GET con bash y se
      # verifica que /health responda 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 30s
      start_interval: 2s
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      users-service:
        condition: service_healthy
      products-service:
        condition: service_healthy

  # Competing Consumers: la misma imagen que orders-service, con el worker
  # habilitado. Las réplicas consumen de la misma cola de RabbitMQ.
  orders-worker:
    build:
      context: ./src
      dockerfile: ./OrdersService/Dockerfile
    image: orders-service:latest
    environment:
      SERVICE_NAME: "orders-worker"
      CONNECTIONSTRINGS__ORDERSDB: "Server=orders-db;Port=3306;Database=ordersdb;User=ordersusr;Password=Pa55w0rd"
      USERSSERVICE__BASEURL: "http://users-service:8000/users/UserService.svc"
      PRODUCTSSERVICE__BASEURL: "http://products-service:8000/products/"
      RABBITMQ__HOST: "rabbitmq"
      CONSUL__URL: "http://consul:8500"
      WORKER__ENABLED: "true"
      WORKER__PROCESSINGDELAYMS: "2000"
    deploy:
      replicas: 3
    healthcheck:
      # La imagen de ASP.NET no trae curl: se hace el GET con bash y se
      # verifica que /health responda 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 30s
      start_interval: 2s
    depends_on:
      orders-service:
        condition: service_healthy

  # Materialized View: la misma imagen que orders-service, con el proyector
  # habilitado. Mantiene la tabla order_details a partir de los eventos. Una
  # sola réplica, para aplicar en orden los eventos de cada Order.
  orders-projector:
    build:
      context: ./src
      dockerfile: ./OrdersService/Dockerfile
    image: orders-service:latest
    environment:
      SERVICE_NAME: "orders-projector"
      CONNECTIONSTRINGS__ORDERSDB: "Server=orders-db;Port=3306;Database=ordersdb;User=ordersusr;Password=Pa55w0rd"
      USERSSERVICE__BASEURL: "http://users-service:8000/users/UserService.svc"
      PRODUCTSSERVICE__BASEURL: "http://products-service:8000/products/"
      RABBITMQ__HOST: "rabbitmq"
      CONSUL__URL: "http://consul:8500"
      PROJECTOR__ENABLED: "true"
    healthcheck:
      # La imagen de ASP.NET no trae curl: se hace el GET con bash y se
      # verifica que /health responda 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 30s
      start_interval: 2s
    depends_on:
      orders-service:
        condition: service_healthy

  products-db:
    image: mongo:9
    ports:
      - "27017:27017"
    volumes:
      - ./src/ProductsService/mongodbdata:/data/db
      - ./src/ProductsService/mongoinit:/docker-entrypoint-initdb.d
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "Pa55w0rd"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "productsusr", "-p", "Pa55w0rd", "--authenticationDatabase", "productsdb", "productsdb", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  products-service:
    build:
      context: ./src
      dockerfile: ./ProductsService/Dockerfile
    image: products-service:latest
    environment:
      SERVICE_NAME: "products-service"
      MONGO_HOST: "products-db"
      MONGO_PORT: "27017"
      MONGO_DB: "productsdb"
      MONGO_USER: "productsusr"
      MONGO_PASSWORD: "Pa55w0rd"
      REDIS__HOST: "redis"
      RABBITMQ__HOST: "rabbitmq"
      CONSUL__URL: "http://consul:8500"
      # Valet Key: la cuenta de almacenamiento de las imágenes. Products la usa
      # con su clave para firmar las URL que entrega a los clientes, que suben y
      # bajan las imágenes directamente de Azurite, en localhost:10000.
      STORAGE__CONNECTIONSTRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      STORAGE__PUBLICBLOBENDPOINT: "http://localhost:10000/devstoreaccount1"
    ports:
      - "8001:8000"
    healthcheck:
      # La imagen de ASP.NET no trae curl: se hace el GET con bash y se
      # verifica que /health responda 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 30s
      start_interval: 2s
    depends_on:
      products-db:
        condition: service_healthy
      # Products atiende sin Redis, sin RabbitMQ y sin Azurite: alcanza con que
      # arranquen.
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      azurite:
        condition: service_started

  # Sidecar: un proxy Envoy junto a products-service, que le agrega
  # autenticación, autorización y un registro de accesos sin cambiar su código
  # -ver ProductsSidecar/envoy.yaml-. Comparte el espacio de red de
  # products-service: para Envoy, Products es 127.0.0.1:8000, y para los demás
  # contenedores el sidecar es products-service:9000. La entrada HTTPS del
  # gateway le envía /products/ al sidecar; la HTTP, directamente a Products.
  products-sidecar:
    image: envoyproxy/envoy:v1.40-latest
    # El registro de accesos se escribe cada medio segundo; por defecto, cada
    # 10 segundos, y en las demos las líneas aparecerían tarde.
    command: ["-c", "/etc/envoy/envoy.yaml", "--file-flush-interval-msec", "500"]
    network_mode: "service:products-service"
    volumes:
      - ./src/ProductsSidecar/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      products-service:
        condition: service_healthy
      keycloak:
        condition: service_started

  # Federated Identity: el proveedor de identidad. Los usuarios inician sesión
  # en Keycloak, que emite los tokens; la aplicación no guarda contraseñas. El
  # realm andis, con sus usuarios, roles y el cliente andis-cli, se importa al
  # arrancar desde Keycloak/andis-realm.json. Consola de administración:
  # http://localhost:8080 -usr: admin pwd: Pa55w0rd-.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "Pa55w0rd"
      # El emisor de los tokens es siempre http://localhost:8080, la dirección
      # que usan los clientes, aunque el gateway y el sidecar llamen a Keycloak
      # por la red de Docker, como keycloak:8080. Si no, un token emitido en
      # una dirección no sería válido en la otra.
      KC_HOSTNAME: "http://localhost:8080"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Métricas para Prometheus, entre ellas los inicios de sesión y las
      # validaciones de tokens.
      KC_METRICS_ENABLED: "true"
      KC_EVENT_METRICS_USER_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./src/Keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # La imagen de Keycloak no trae curl: se hace el GET con bash al puerto
      # de administración, 9000, y se verifica que /health/ready responda 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Valet Key: el almacenamiento de las imágenes de los Products. Azurite es el
  # emulador de Azure Storage: las URL firmadas que entrega Products son SAS
  # -Shared Access Signatures-, como en Azure.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck", "--loose"]
    ports:
      - "10000:10000"

  # External Configuration Store: la configuración central, en el KV de Consul,
  # bajo el prefijo andis/. Consola: http://localhost:8500. Sin volumen: si se
  # recrea el contenedor, el almacén arranca vacío y los servicios usan sus
  # valores por defecto. Ningún servicio espera a Consul: arrancan sin él.
  consul:
    image: hashicorp/consul:1.21
    command: ["agent", "-dev", "-client", "0.0.0.0", "-log-level", "warn"]
    ports:
      - "8500:8500"

  # Messaging Bridge: el broker del ERP legado, con su propia infraestructura de
  # mensajería. Consola: http://localhost:8161/admin/ -usr: admin pwd: admin-.
  legacy-broker:
    image: apache/activemq-classic:6.1.7
    # La consola trae la directiva upgrade-insecure-requests, que hace que el
    # navegador pida los enlaces y los estilos por HTTPS, y este puerto solo habla
    # HTTP. Sin esto, la página de Queues no abre.
    entrypoint: ["sh", "-c", "sed -i 's/upgrade-insecure-requests; //' /opt/apache-activemq/conf/jetty.xml && exec /usr/local/bin/entrypoint.sh activemq console"]
    ports:
      - "8161:8161"
    healthcheck:
      # Sano si acepta conexiones en el puerto de sus clientes.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/61616"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Un ERP legado simulado: solo conoce ActiveMQ y sus registros de ancho fijo.
  legacy-erp:
    build:
      context: ./src
      dockerfile: ./LegacyErp/Dockerfile
    image: legacy-erp:latest
    environment:
      LEGACYBROKER__HOST: "legacy-broker"
    depends_on:
      legacy-broker:
        condition: service_healthy

  # Messaging Bridge: el único componente que conoce los dos brokers. Si uno no
  # está, los mensajes esperan en el otro.
  messaging-bridge:
    build:
      context: ./src
      dockerfile: ./MessagingBridge/Dockerfile
    image: messaging-bridge:latest
    environment:
      RABBITMQ__HOST: "rabbitmq"
      LEGACYBROKER__HOST: "legacy-broker"
    depends_on:
      rabbitmq:
        condition: service_healthy
      legacy-broker:
        condition: service_healthy

  # Strangler Fig: el monolito que se reemplaza. Solo se llega a él a través de
  # la fachada del gateway, en el puerto 8090.
  monolith:
    build:
      context: ./src
      dockerfile: ./Monolith/Dockerfile
    image: monolith:latest

  # Anti-corruption Layer: Purchases muestra las compras de cada Product con su
  # propio modelo. Su capa anticorrupción traduce desde Orders y desde el SOAP de
  # Users. El gateway la publica en /purchases/.
  purchases-service:
    build:
      context: ./src
      dockerfile: ./PurchasesService/Dockerfile
    image: purchases-service:latest
    environment:
      ORDERSSERVICE__BASEURL: "http://orders-service:8000/orders/"
      USERSSERVICE__BASEURL: "http://users-service:8000/users/UserService.svc"
    healthcheck:
      # La imagen de ASP.NET no trae curl: se hace el GET con bash y se
      # verifica que /health responda 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 30s
      start_interval: 2s
    depends_on:
      orders-service:
        condition: service_healthy
      users-service:
        condition: service_healthy

  # Backends for Frontends: un backend por cliente. El gateway publica el de la
  # web en /web/ y el de la app móvil en /mobile/.
  bff-web:
    build:
      context: ./src
      dockerfile: ./BffWeb/Dockerfile
    image: bff-web:latest
    environment:
      ORDERSSERVICE__BASEURL: "http://orders-service:8000/orders/"
      PRODUCTSSERVICE__BASEURL: "http://products-service:8000/products/"
    healthcheck:
      # La imagen de ASP.NET no trae curl: se hace el GET con bash y se
      # verifica que /health responda 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 30s
      start_interval: 2s
    depends_on:
      orders-service:
        condition: service_healthy
      products-service:
        condition: service_healthy

  bff-mobile:
    build:
      context: ./src
      dockerfile: ./BffMobile/Dockerfile
    image: bff-mobile:latest
    environment:
      ORDERSSERVICE__BASEURL: "http://orders-service:8000/orders/"
    healthcheck:
      # La imagen de ASP.NET no trae curl: se hace el GET con bash y se
      # verifica que /health responda 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 30s
      start_interval: 2s
    depends_on:
      orders-service:
        condition: service_healthy

  users-db:
    image: postgres:18
    environment:
      POSTGRES_DB: "usersdb"
      POSTGRES_USER: "usersusr"
      POSTGRES_PASSWORD: "Pa55w0rd"
    ports:
      - "5432:5432"
    volumes:
      - ./src/UsersService/pgdata:/var/lib/postgresql
      - ./src/UsersService/pginit:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "usersusr", "-d", "usersdb"]
      interval: 5s
      timeout: 5s
      retries: 30

  users-service:
    build:
      context: ./src
      dockerfile: ./UsersService/Dockerfile
    image: users-service:latest
    environment:
      SERVICE_NAME: "users-service"
      CONNECTIONSTRINGS__USERSDB: "Host=users-db;Port=5432;Database=usersdb;Username=usersusr;Password=Pa55w0rd"
      RABBITMQ__HOST: "rabbitmq"
    ports:
      - "8002:8000"
    healthcheck:
      # La imagen de ASP.NET no trae curl: se hace el GET con bash y se
      # verifica que /health responda 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 30s
      start_interval: 2s
    depends_on:
      users-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  # Demos de facilidad de despliegue: la versión 2 de Users, la que trae el
  # experimento de A/B Testing. Es la misma imagen que users-service, con otra
  # versión configurada -ver UsersService/Release.cs-, y comparte la base. No
  # publica puertos: se llega por la entrada de despliegue del gateway, en el
  # 8091. Los demás servicios siguen llamando a users-service, la versión 1.
  users-service-v2:
    image: users-service:latest
    environment:
      SERVICE_NAME: "users-service-v2"
      CONNECTIONSTRINGS__USERSDB: "Host=users-db;Port=5432;Database=usersdb;Username=usersusr;Password=Pa55w0rd"
      RABBITMQ__HOST: "rabbitmq"
      RELEASE__VERSION: "2"
      # A/B Testing: la variante del experimento la decide Unleash, del perfil
      # feature-flags. Si no está levantado, Users responde con la variante A.
      UNLEASH__URL: "http://unleash:4242/api/"
      UNLEASH__TOKEN: "default:development.andis-client-token"
    networks:
      default:
        # Rolling Upgrade: el grupo de instancias que atiende la entrada de
        # despliegue. Las réplicas de esta versión y las instancias de la 1 que
        # crea la demo 28 comparten el nombre, y el DNS de Docker devuelve todas.
        aliases: ["users-pool"]
    healthcheck:
      # La imagen de ASP.NET no trae curl: se hace el GET con bash y se
      # verifica que /health responda 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 30s
      start_interval: 2s
    depends_on:
      users-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  # A/B Testing: Unleash decide qué variante del experimento ve cada User, y la
  # versión 2 de Users se lo pregunta con OpenFeature -ver UsersService/Experiment.cs-.
  # Se levanta con
  #   docker compose --profile feature-flags up -d --wait
  # La demo 30 lo levanta sola. Consola: http://localhost:4242, usuario admin,
  # contraseña unleash4all.
  unleash-db:
    image: postgres:18
    profiles: ["feature-flags"]
    environment:
      POSTGRES_DB: "unleash"
      POSTGRES_USER: "unleashusr"
      POSTGRES_PASSWORD: "Pa55w0rd"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "unleashusr", "-d", "unleash"]
      interval: 5s
      timeout: 3s
      retries: 5

  unleash:
    image: unleashorg/unleash-server:8.2.1
    profiles: ["feature-flags"]
    environment:
      DATABASE_URL: "postgres://unleashusr:Pa55w0rd@unleash-db:5432/unleash"
      DATABASE_SSL: "false"
      # Tokens fijos, para no crearlos a mano: el de administración lo usan los
      # scripts de las demos para configurar el flag, y el de cliente, Users
      # para leerlo. Es un entorno de demo: en producción serían secretos.
      INIT_ADMIN_API_TOKENS: "*:*.andis-admin-token"
      INIT_CLIENT_API_TOKENS: "default:development.andis-client-token"
    ports:
      - "4242:4242"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4242/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 2s
    depends_on:
      unleash-db:
        condition: service_healthy

  # Observabilidad -opcional-: se levanta con
  #   docker compose --profile observability up -d
  # Prometheus: http://localhost:9090 · Grafana: http://localhost:3000
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # Permite que k6 le envíe sus métricas con remote write.
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.2.5
    profiles: ["observability"]
    environment:
      # Sin login: es un entorno de demo.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/andis-demo.json"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Pruebas de carga: no queda corriendo, se ejecuta un escenario por vez con
  #   docker compose run --rm k6 run /scripts/bulkhead.js
  # Los resultados se ven en la terminal y, si está levantado el perfil
  # observability, también en Grafana.
  k6:
    image: grafana/k6:2.3.0
    profiles: ["k6"]
    environment:
      BASE_URL: "http://api-gateway"
      ORDERS_DIRECT: "http://orders-service:8000"
      K6_OUT: "experimental-prometheus-rw"
      K6_PROMETHEUS_RW_SERVER_URL: "http://prometheus:9090/api/v1/write"
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(95),p(99),max"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: "2s"
    volumes:
      - ./k6:/scripts:ro
