# La ruta del Gateway hacia Users, con dos destinos y un peso para cada uno. Es
# el split_clients de la demo 30: qué fracción de las solicitudes va a cada
# versión. Argo Rollouts cambia los pesos en cada paso; acá empiezan con todo a
# la versión estable.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: users
  namespace: andis
spec:
  parentRefs:
    - name: andis
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /users/
      backendRefs:
        - name: users-stable
          port: 8000
          weight: 100
        - name: users-canary
          port: 8000
          weight: 0
