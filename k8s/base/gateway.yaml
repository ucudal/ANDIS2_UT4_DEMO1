# La entrada de los clientes al clúster: un Gateway de Gateway API, que
# implementa NGINX Gateway Fabric. Cumple el papel de la entrada de despliegue
# de Docker Compose: a qué versión de Users va cada solicitud lo deciden las
# HTTPRoute de cada demo, y Argo Rollouts las cambia.
#
# NGINX Gateway Fabric crea, para este Gateway, un Deployment de nginx y un
# Service. El NginxProxy de abajo hace que ese Service sea NodePort con un puerto
# fijo, 30092, que kind publica en el 8092 de la máquina -ver k8s/kind.yaml-.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: andis
  namespace: andis
spec:
  gatewayClassName: nginx
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: andis-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: andis-gateway
  namespace: andis
spec:
  kubernetes:
    service:
      type: NodePort
      nodePorts:
        - port: 30092
          listenerPort: 80
